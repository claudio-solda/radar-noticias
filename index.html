<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar de Notícias - Brasil & Mundo</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Ícones Lucide (via cdnjs, permitido) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide-static/0.451.0/umd/lucide.min.js"></script>
  <style>
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .line-clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header / Navbar -->
  <header class="sticky top-0 z-50 bg-slate-800/95 backdrop-blur border-b border-slate-700 shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i data-lucide="newspaper" class="text-blue-500 w-7 h-7"></i>
        <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
          Radar Notícias
        </h1>
      </div>
      <button onclick="carregarNoticias()" title="Atualizar Notícias" class="p-2 rounded-full hover:bg-slate-700 transition">
        <i data-lucide="refresh-cw" id="icon-refresh" class="w-5 h-5 text-slate-300"></i>
      </button>
    </div>

    <!-- Categorias / Filtros -->
    <nav class="max-w-6xl mx-auto px-4 pb-3 flex gap-2 overflow-x-auto">
      <button onclick="trocarCategoria('geral')" id="cat-geral" class="btn-cat bg-blue-600 text-white px-4 py-1.5 rounded-full text-sm font-medium transition whitespace-nowrap">
        Brasil & Mundo
      </button>
      <button onclick="trocarCategoria('tecnologia')" id="cat-tecnologia" class="btn-cat bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-1.5 rounded-full text-sm font-medium transition whitespace-nowrap">
        Tecnologia
      </button>
      <button onclick="trocarCategoria('esportes')" id="cat-esportes" class="btn-cat bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-1.5 rounded-full text-sm font-medium transition whitespace-nowrap">
        Esportes
      </button>
      <button onclick="trocarCategoria('economia')" id="cat-economia" class="btn-cat bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-1.5 rounded-full text-sm font-medium transition whitespace-nowrap">
        Economia
      </button>
    </nav>
  </header>

  <!-- Feed Principal -->
  <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">

    <!-- Status / Loading -->
    <div id="loading" class="flex flex-col items-center justify-center py-20 gap-3">
      <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-slate-400 text-sm">Buscando as notícias mais recentes...</p>
    </div>

    <!-- Container dos Cards -->
    <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>

  </main>

  <!-- Footer -->
  <footer class="bg-slate-800 border-t border-slate-700 text-center py-4 text-xs text-slate-400">
    Atualizado em tempo real via RSS público • Radar Notícias
  </footer>

  <script>
    // Feeds RSS de portais confiáveis (com mais de uma fonte por categoria como fallback)
    const FEEDS = {
      geral: [
        'https://g1.globo.com/rss/g1/',
        'https://feeds.bbci.co.uk/portuguese/rss.xml'
      ],
      tecnologia: [
        'https://g1.globo.com/rss/g1/tecnologia/'
      ],
      esportes: [
        'https://ge.globo.com/rss/ge/'
      ],
      economia: [
        'https://g1.globo.com/rss/g1/economia/'
      ]
    };

    const IMAGEM_PADRAO = 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=600&q=80';
    let categoriaAtual = 'geral';

    // Proxies CORS usados como fallback em cascata (o primeiro que funcionar é usado)
    const PROXIES = [
      (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
      (url) => `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}&_=${Date.now()}`
    ];

    // Busca e converte um feed RSS em uma lista de itens no formato interno do app
    async function buscarFeed(url) {
      let ultimoErro = null;

      for (const montarProxyUrl of PROXIES) {
        try {
          const proxyUrl = montarProxyUrl(url);
          const res = await fetch(proxyUrl);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);

          const textoOuJson = await res.text();

          // Caso o proxy seja o rss2json (retorna JSON pronto)
          if (proxyUrl.includes('rss2json.com')) {
            const data = JSON.parse(textoOuJson);
            if (data.status === 'ok' && data.items?.length) return data.items;
            throw new Error('rss2json sem itens');
          }

          // Caso contrário, é XML puro (RSS) — parseamos manualmente
          const itens = parseRSS(textoOuJson);
          if (itens.length) return itens;
          throw new Error('XML sem itens');
        } catch (err) {
          ultimoErro = err;
          continue; // tenta o próximo proxy
        }
      }

      throw ultimoErro || new Error('Todas as fontes falharam');
    }

    // Converte um XML de RSS em um array de itens { title, link, pubDate, description, thumbnail, author }
    function parseRSS(xmlTexto) {
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlTexto, 'text/xml');

      if (xml.querySelector('parsererror')) return [];

      const items = Array.from(xml.querySelectorAll('item'));
      return items.map(item => {
        const get = (tag) => item.querySelector(tag)?.textContent?.trim() || '';

        let thumbnail = item.querySelector('enclosure')?.getAttribute('url')
          || item.getElementsByTagName('media:thumbnail')[0]?.getAttribute('url')
          || item.getElementsByTagName('media:content')[0]?.getAttribute('url')
          || '';

        return {
          title: get('title'),
          link: get('link'),
          pubDate: get('pubDate'),
          description: get('description'),
          author: get('author') || get('dc:creator'),
          thumbnail
        };
      });
    }

    async function carregarNoticias() {
      const loading = document.getElementById('loading');
      const container = document.getElementById('news-container');
      const iconRefresh = document.getElementById('icon-refresh');

      loading.classList.remove('hidden');
      container.classList.add('hidden');
      iconRefresh.classList.add('animate-spin');
      container.innerHTML = '';

      let todasNoticias = [];
      let algumErro = false;

      try {
        const urls = FEEDS[categoriaAtual];

        const resultados = await Promise.allSettled(urls.map(buscarFeed));

        resultados.forEach(r => {
          if (r.status === 'fulfilled' && r.value?.length) {
            todasNoticias = todasNoticias.concat(r.value);
          } else {
            algumErro = true;
          }
        });

        // Ordena por data mais recente
        todasNoticias.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

        if (todasNoticias.length === 0) {
          throw new Error('Nenhuma fonte retornou notícias');
        }

        renderizarNoticias(todasNoticias);

        if (algumErro) {
          const aviso = document.createElement('p');
          aviso.className = 'col-span-full text-center text-xs text-amber-400 mb-2';
          aviso.textContent = 'Algumas fontes não responderam agora — mostrando o que foi possível carregar.';
          container.prepend(aviso);
        }
      } catch (error) {
        console.error('Erro ao buscar notícias:', error);
        container.innerHTML = `
          <div class="col-span-full text-center py-12 text-rose-400">
            <p class="font-semibold">Erro ao carregar o feed de notícias.</p>
            <p class="text-xs text-slate-400 mt-1">Verifique sua conexão e tente novamente em instantes.</p>
            <button onclick="carregarNoticias()" class="mt-4 bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-lg text-xs font-semibold transition">
              Tentar novamente
            </button>
          </div>
        `;
      } finally {
        loading.classList.add('hidden');
        container.classList.remove('hidden');
        iconRefresh.classList.remove('animate-spin');
      }
    }

    function renderizarNoticias(noticias) {
      const container = document.getElementById('news-container');

      if (!noticias || noticias.length === 0) {
        container.innerHTML = `<p class="col-span-full text-center text-slate-400">Nenhuma notícia encontrada.</p>`;
        return;
      }

      noticias.forEach(item => {
        let imagem = item.thumbnail || item.enclosure?.link;

        if (!imagem && item.description) {
          const imgMatch = item.description.match(/<img[^>]+src="([^">]+)"/);
          if (imgMatch) imagem = imgMatch[1];
        }

        if (!imagem) imagem = IMAGEM_PADRAO;

        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = item.description || '';
        const textoLimpo = tempDiv.textContent || tempDiv.innerText || '';

        const dataFormatada = new Date(item.pubDate).toLocaleDateString('pt-BR', {
          day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
        });

        const card = document.createElement('article');
        card.className = 'bg-slate-800 rounded-xl overflow-hidden border border-slate-700/60 shadow-lg hover:border-slate-500 transition duration-300 flex flex-col hover:-translate-y-1';

        card.innerHTML = `
          <div class="relative h-48 w-full bg-slate-950 overflow-hidden">
            <img src="${imagem}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-500 hover:scale-105" loading="lazy" onerror="this.onerror=null;this.src='${IMAGEM_PADRAO}'">
          </div>
          <div class="p-5 flex flex-col flex-1">
            <div class="flex items-center justify-between text-xs text-blue-400 font-medium mb-2">
              <span>${item.author || 'Notícias'}</span>
              <span class="text-slate-400">${dataFormatada}</span>
            </div>
            <h2 class="text-base font-bold text-slate-100 line-clamp-2 mb-2 hover:text-blue-400 transition">
              <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
            </h2>
            <p class="text-xs text-slate-300 line-clamp-3 mb-4 flex-1">${textoLimpo}</p>
            <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-1.5 w-full bg-slate-700/70 hover:bg-blue-600 text-slate-200 hover:text-white py-2 rounded-lg text-xs font-semibold transition">
              Ler notícia completa <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
            </a>
          </div>
        `;

        container.appendChild(card);
      });

      lucide.createIcons();
    }

    function trocarCategoria(cat) {
      categoriaAtual = cat;

      document.querySelectorAll('.btn-cat').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('bg-slate-700', 'text-slate-300');
      });

      const btnAtivo = document.getElementById(`cat-${cat}`);
      btnAtivo.classList.remove('bg-slate-700', 'text-slate-300');
      btnAtivo.classList.add('bg-blue-600', 'text-white');

      carregarNoticias();
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      carregarNoticias();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW falhou:', err));
      }
    });
  </script>
</body>
</html>
